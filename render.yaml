# Blueprint Render — conecte o repo em https://dashboard.render.com/blueprints
databases:
  - name: odonto-db
    plan: free
    databaseName: gabriela_dental
    user: gabriela

services:
  - type: web
    name: odonto-academy
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && cd server && npm ci
    startCommand: cd server && NODE_ENV=production npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: odonto-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@gabrielabarreto.com
      - key: ADMIN_PASSWORD
        generateValue: true
