# /etc/nginx/conf.d/gbdental.conf
# Servidor Nginx: 10.100.15.2
# Domínio público: gbdental.com.br → IP público 45.174.64.123 (NAT/firewall → este host)
#
# Certbot (webroot):
#   certbot certonly --webroot -w /var/www/certbot -d gbdental.com.br -d www.gbdental.com.br
#   nginx -t && systemctl reload nginx

upstream gbdental_app {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Domínio: ACME + redirect HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gbdental.com.br www.gbdental.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# IP interno: HTTP sem redirect (teste local)
server {
    listen 80;
    listen [::]:80;
    server_name 10.100.15.2;

    location / {
        proxy_pass http://gbdental_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gbdental.com.br www.gbdental.com.br;

    ssl_certificate     /etc/letsencrypt/live/gbdental.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gbdental.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://gbdental_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }
}
